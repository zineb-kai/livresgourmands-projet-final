  <rect x="64" y="422" width="412" height="132" rx="8" fill="#1E2A38"/>
  <text x="86" y="454" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">LivresGourmands.net</text>
  <text x="86" y="478" font-size="12" fill="#F3C6B2">Librairie en ligne — Édition &amp; Gastronomie</text>
  <text x="86" y="506" font-size="11" fill="#CBD5E1">Contraste WCAG AA validé sur fond sombre (#1E2A38)</text>
  <text x="86" y="526" font-size="11" fill="#CBD5E1">et sur fond crème papier (#FAF7F2).</text>

  <!-- Colonne Nuancier officiel (à la manière Chloé Bonnevaux) -->
  <rect x="928" y="88" width="152" height="90" rx="8" fill="#1E2A38"/>
  <text x="1004" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Bleu encre</text>
  <text x="1004" y="148" text-anchor="middle" font-size="11" fill="#CBD5E1">#1E2A38</text>

  <rect x="928" y="188" width="152" height="90" rx="8" fill="#B85D3B"/>
  <text x="1004" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Terracotta</text>
  <text x="1004" y="248" text-anchor="middle" font-size="11" fill="#FDECE4">#B85D3B</text>

  <rect x="928" y="288" width="152" height="90" rx="8" fill="#4E6E58"/>
  <text x="1004" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Vert sauge</text>
  <text x="1004" y="348" text-anchor="middle" font-size="11" fill="#E3EFE7">#4E6E58</text>

  <rect x="928" y="388" width="152" height="90" rx="8" fill="#FAF7F2" stroke="#D5CCC0" stroke-width="1.5"/>
  <text x="1004" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A38">Crème papier</text>
  <text x="1004" y="448" text-anchor="middle" font-size="11" fill="#5B636C">#FAF7F2</text>

  <rect x="928" y="488" width="152" height="92" rx="8" fill="#FFFFFF" stroke="#D5CCC0" stroke-width="1.5"/>
  <text x="1004" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#26292E">Surface &amp; Texte</text>
  <text x="1004" y="548" text-anchor="middle" font-size="11" fill="#5B636C">#FFFFFF / #26292E</text>

  <!-- Bandeau bas résumé -->
  <rect x="524" y="416" width="380" height="164" rx="10" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5"/>
  <text x="546" y="446" font-size="12" font-weight="700" fill="#5B636C">PRINCIPES ERGONOMIQUES</text>
  <text x="546" y="472" font-size="12" fill="#26292E">• Hiérarchie visuelle immédiate (prix, stock, CTA)</text>
  <text x="546" y="496" font-size="12" fill="#26292E">• Navigation fluide sur 3 formats (Desktop/Tablette/Mobile)</text>
  <text x="546" y="520" font-size="12" fill="#26292E">• Retours explicites (succès, erreurs, ruptures)</text>
  <text x="546" y="544" font-size="12" fill="#26292E">• Focus clavier visible et attributs ARIA complets</text>
</svg>

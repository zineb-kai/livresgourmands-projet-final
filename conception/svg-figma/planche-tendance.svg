<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Inter, Arial, sans-serif">
  <rect width="1120" height="620" fill="#FAF7F2"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1E2A38">Planche de tendance — Univers visuel LivresGourmands.net</text>
  <text x="40" y="64" font-size="12" fill="#5B636C">Direction artistique : librairie contemporaine, chaleur éditoriale, lisibilité et gourmandise</text>

  <!-- Mots-clés d'ambiance -->
  <rect x="40" y="88" width="460" height="150" rx="10" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5"/>
  <text x="270" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1E2A38" letter-spacing="4">ÉLÉGANCE</text>
  <text x="270" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#B85D3B" letter-spacing="4">GOURMANDISE</text>
  <text x="270" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#4E6E58" letter-spacing="4">CLARTÉ</text>


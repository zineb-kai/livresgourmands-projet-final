  <rect x="524" y="88" width="380" height="310" rx="10" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5"/>
  <text x="546" y="116" font-size="12" font-weight="700" fill="#5B636C">UNIVERS COUVERTURES &amp; TEXTURES</text>
  <rect x="546" y="132" width="104" height="145" rx="6" fill="#1E2A38"/>
  <rect x="546" y="132" width="10" height="145" fill="#101820"/>
  <line x1="564" y1="185" x2="594" y2="185" stroke="#E3B778" stroke-width="2.5"/>

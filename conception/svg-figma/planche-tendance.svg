  <rect x="546" y="294" width="336" height="84" rx="6" fill="#FAF7F2" stroke="#E6DFD5"/>
  <text x="564" y="320" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1E2A38">Playfair Display — Titres éditoriaux</text>
  <text x="564" y="344" font-size="13" fill="#26292E">Inter — Corps de texte fluide et contrasté</text>
  <text x="564" y="364" font-size="11" fill="#5B636C">Papier crème doux • Filets fins • Icônes vectorielles légères</text>

  <!-- Composants UI & Micro-ambiance -->
  <rect x="40" y="256" width="460" height="324" rx="10" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5"/>
  <text x="64" y="286" font-size="12" font-weight="700" fill="#5B636C">COMPOSANTS &amp; REPÈRES VISUELS</text>
  <rect x="64" y="306" width="190" height="44" rx="6" fill="#B85D3B"/><text x="159" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Ajouter au panier</text>
  <rect x="272" y="306" width="204" height="44" rx="6" fill="#FFFFFF" stroke="#B85D3B" stroke-width="1.8"/><text x="374" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#B85D3B">Ajouter à une liste cadeau</text>
  <rect x="64" y="370" width="110" height="28" rx="14" fill="#4E6E58"/><text x="119" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">En stock (12)</text>
  <rect x="186" y="370" width="120" height="28" rx="14" fill="#1E2A38"/><text x="246" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Gastronomie</text>

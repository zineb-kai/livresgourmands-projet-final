<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Inter, Arial, sans-serif">
  <rect width="1120" height="620" fill="#FAF7F2"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1E2A38">Arborescence du site — LivresGourmands.net</text>
  <text x="40" y="64" font-size="12" fill="#5B636C">Organisation hiérarchique des pages (Niveaux 1, 2 et 3) et flux par rôle (Visiteur, Client, Ami, Éditeur/Admin)</text>

  <!-- Niveau 1 -->
  <text x="40" y="102" font-size="12" font-weight="700" fill="#B85D3B">NIVEAU 1 — ACCUEIL &amp; NAVIGATION PRINCIPALE</text>
  <rect x="40" y="114" width="210" height="54" rx="8" fill="#1E2A38"/>
  <text x="145" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Page d'accueil (/)</text>
  <text x="145" y="156" text-anchor="middle" font-size="10" fill="#F3C6B2">Carrousel • Filtres • Sélection • Nouveautés</text>

  <!-- Header nav pills -->
  <rect x="300" y="114" width="780" height="54" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5"/>
  <text x="320" y="133" font-size="10" font-weight="700" fill="#5B636C">BARRE DE NAVIGATION PRINCIPALE</text>
  <g font-size="11" font-weight="600" fill="#FFFFFF">
    <rect x="320" y="140" width="84" height="22" rx="4" fill="#1E2A38"/><text x="362" y="155" text-anchor="middle">Accueil</text>
    <rect x="412" y="140" width="94" height="22" rx="4" fill="#1E2A38"/><text x="459" y="155" text-anchor="middle">Catalogue</text>
    <rect x="514" y="140" width="96" height="22" rx="4" fill="#1E2A38"/><text x="562" y="155" text-anchor="middle">Catégories</text>
    <rect x="618" y="140" width="112" height="22" rx="4" fill="#4E6E58"/><text x="674" y="155" text-anchor="middle">Liste d'un ami</text>
    <rect x="738" y="140" width="92" height="22" rx="4" fill="#B85D3B"/><text x="784" y="155" text-anchor="middle">Panier [N]</text>
    <rect x="838" y="140" width="106" height="22" rx="4" fill="#2C3E50"/><text x="891" y="155" text-anchor="middle">Mon compte ▾</text>
    <rect x="952" y="140" width="112" height="22" rx="4" fill="#8C462B"/><text x="1008" y="155" text-anchor="middle">Dashboard*</text>
  </g>
  <line x1="250" y1="141" x2="300" y2="141" stroke="#B85D3B" stroke-width="2"/>

  <!-- Connecteurs Niveau 1 -> Niveau 2 -->
  <line x1="145" y1="168" x2="145" y2="210" stroke="#1E2A38" stroke-width="1.5"/>
  <line x1="95" y1="210" x2="1015" y2="210" stroke="#1E2A38" stroke-width="1.5"/>

  <!-- Niveau 2 -->
  <text x="40" y="200" font-size="12" font-weight="700" fill="#B85D3B">NIVEAU 2 — RUBRIQUES PRINCIPALES</text>
  <g font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <line x1="95" y1="210" x2="95" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="40" y="232" width="110" height="54" rx="6" fill="#1E2A38"/>
    <text x="95" y="256">Catalogue</text><text x="95" y="272" font-size="9" font-weight="400" fill="#D9E2EC">/catalogue</text>

    <line x1="220" y1="210" x2="220" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="165" y="232" width="110" height="54" rx="6" fill="#1E2A38"/>
    <text x="220" y="256">Catégories</text><text x="220" y="272" font-size="9" font-weight="400" fill="#D9E2EC">/categories</text>

    <line x1="345" y1="210" x2="345" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="290" y="232" width="110" height="54" rx="6" fill="#B85D3B"/>
    <text x="345" y="256">Panier</text><text x="345" y="272" font-size="9" font-weight="400" fill="#FCECE4">/panier</text>

    <line x1="470" y1="210" x2="470" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="415" y="232" width="110" height="54" rx="6" fill="#B85D3B"/>
    <text x="470" y="256">Commandes</text><text x="470" y="272" font-size="9" font-weight="400" fill="#FCECE4">/commandes</text>

    <line x1="595" y1="210" x2="595" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="540" y="232" width="110" height="54" rx="6" fill="#4E6E58"/>
    <text x="595" y="256">Mes listes</text><text x="595" y="272" font-size="9" font-weight="400" fill="#EAF1EC">/listes</text>

    <line x1="720" y1="210" x2="720" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="665" y="232" width="110" height="54" rx="6" fill="#4E6E58"/>
    <text x="720" y="256">Accès Ami</text><text x="720" y="272" font-size="9" font-weight="400" fill="#EAF1EC">/listes/partage</text>

    <line x1="845" y1="210" x2="845" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="790" y="232" width="110" height="54" rx="6" fill="#2C3E50"/>
    <text x="845" y="256">Profil &amp; Auth</text><text x="845" y="272" font-size="9" font-weight="400" fill="#D9E2EC">/profil • /login</text>

    <line x1="1015" y1="210" x2="1015" y2="232" stroke="#1E2A38" stroke-width="1.5"/>
    <rect x="935" y="232" width="145" height="54" rx="6" fill="#8C462B"/>
    <text x="1007" y="256">Dashboard Protégé</text><text x="1007" y="272" font-size="9" font-weight="400" fill="#F5D9C3">/dashboard</text>
  </g>

  <!-- Niveau 3 -->
  <text x="40" y="340" font-size="12" font-weight="700" fill="#B85D3B">NIVEAU 3 — ÉCRANS DÉTAILLÉS &amp; SOUS-MODULES</text>

  <!-- Fiche produit -->
  <line x1="95" y1="286" x2="95" y2="356" stroke="#1E2A38" stroke-width="1.5"/>
  <rect x="40" y="356" width="190" height="74" rx="6" fill="#FFFFFF" stroke="#1E2A38" stroke-width="1.5"/>
  <text x="135" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A38">Fiche produit (/ouvrages/:id)</text>
  <text x="135" y="396" text-anchor="middle" font-size="10" fill="#5B636C">Couverture • ISBN • Stock • Quantité</text>
  <text x="135" y="412" text-anchor="middle" font-size="10" fill="#5B636C">Avis vérifiés • Commentaires modérés</text>

  <!-- Tunnel achat -->
  <line x1="345" y1="286" x2="345" y2="356" stroke="#B85D3B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="470" y1="286" x2="470" y2="356" stroke="#B85D3B" stroke-width="1.5"/>
  <rect x="285" y="356" width="240" height="74" rx="6" fill="#FFFFFF" stroke="#B85D3B" stroke-width="1.5"/>
  <text x="405" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#B85D3B">Tunnel Commande &amp; Paiement Test</text>
  <text x="405" y="396" text-anchor="middle" font-size="10" fill="#5B636C">Adresse • Lent / Rapide / 24h chrono</text>
  <text x="405" y="412" text-anchor="middle" font-size="10" fill="#5B636C">Confirmation • Modale Détails &amp; Reçu</text>

  <!-- Liste partagee -->
  <line x1="720" y1="286" x2="720" y2="356" stroke="#4E6E58" stroke-width="1.5"/>
  <rect x="570" y="356" width="230" height="74" rx="6" fill="#FFFFFF" stroke="#4E6E58" stroke-width="1.5"/>
  <text x="685" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#4E6E58">Liste partagée (/listes/partage/:code)</text>
  <text x="685" y="396" text-anchor="middle" font-size="10" fill="#5B636C">Accès public par code personnel</text>
  <text x="685" y="412" text-anchor="middle" font-size="10" fill="#5B636C">Mise au panier ou Achat cadeau test</text>

  <!-- Modules dashboard -->
  <line x1="1007" y1="286" x2="1007" y2="356" stroke="#8C462B" stroke-width="1.5"/>
  <rect x="835" y="356" width="245" height="106" rx="6" fill="#FFFFFF" stroke="#8C462B" stroke-width="1.5"/>
  <text x="957" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#8C462B">Modules Back Office (RBAC)</text>
  <text x="850" y="398" font-size="10" fill="#26292E">• Vue d'ensemble (KPI MySQL)</text>
  <text x="850" y="414" font-size="10" fill="#26292E">• Ouvrages (Éditeur + Admin)</text>
  <text x="850" y="430" font-size="10" fill="#26292E">• Modération commentaires (Éditeur + Admin)</text>
  <text x="850" y="446" font-size="10" fill="#26292E">• Catégories, Commandes, Utilisateurs (Admin)</text>

  <!-- Légende -->
  <rect x="40" y="505" width="1040" height="78" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.2"/>
  <text x="60" y="530" font-size="12" font-weight="700" fill="#1E2A38">LÉGENDE DES ACCÈS &amp; PARCOURS</text>
  <rect x="60" y="544" width="16" height="16" rx="3" fill="#1E2A38"/><text x="84" y="557" font-size="11" fill="#26292E">Public (Visiteur / Client)</text>
  <rect x="255" y="544" width="16" height="16" rx="3" fill="#B85D3B"/><text x="279" y="557" font-size="11" fill="#26292E">Parcours Achat (Panier / Commande)</text>
  <rect x="515" y="544" width="16" height="16" rx="3" fill="#4E6E58"/><text x="539" y="557" font-size="11" fill="#26292E">Listes cadeaux &amp; Parcours Ami</text>
  <rect x="755" y="544" width="16" height="16" rx="3" fill="#8C462B"/><text x="779" y="557" font-size="11" fill="#26292E">Back Office (*Éditeur / Admin)</text>
</svg>
